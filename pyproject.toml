[project]
name = "openmeteo-sunstack"
version = "0.3.0"
description = "Research-grade solar/UV forecast, historical calibration, and absolute/local TanScore stack"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=18",
  "requests>=2.32",
  "requests-cache>=1.2",
  "retry-requests>=2.0",
  "scikit-learn>=1.7",
  "joblib>=1.4",
  "pvlib>=0.13",
  "xarray>=2025.1",
  "netCDF4>=1.7",
  "cdsapi>=0.7.7",
  "fastapi>=0.116",
  "uvicorn>=0.35",
  "python-dotenv>=1.1",
]

[project.scripts]
sunstack = "sunstack.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sunstack"]

# Photobiology runtime data must ship inside the wheel: an installed `sunstack`
# has no repository checkout to fall back to. Resolved via importlib.resources
# with a repo-layout fallback (see photobiology._package_bytes).
[tool.hatch.build.targets.wheel.force-include]
"data/research/action_spectra" = "sunstack/_data/action_spectra"
"data/calibration/global_melanogenic_reference" = "sunstack/_data/global_melanogenic_reference"

[tool.uv]
required-version = "==0.12.15"

[tool.pyright]
venvPath = "."
venv = ".venv"

 [dependency-groups]
dev = [
    "ast-grep-cli>=0.45.3",
    "bandit>=1.9.4",
    "basedpyright>=1.40.1",
    "blockbuster>=1.5,<1.6",
    "check-jsonschema>=0.38.0",
    "check-manifest>=0.51",
    "complexipy>=8.0.1",
    "coverage>=7.16.1",
    "crosshair-tool>=0.0.110",
    "deal[all]>=4.24.6",
    "deptry>=0.25.1",
    "freezegun>=1.5.5",
    "griffe>=2.3.0",
    "hypofuzz>=25.11.1",
    "hypothesis[cli]>=6.168.0",
    "import-linter>=2.15",
    "lizard>=1.24.0",
    "mypy>=2.3.1",
    "nox>=2026.8.17",
    "py-spy>=0.4.2",
    "pyanalyze>=0.13.1",
    "pydoclint>=0.9.1",
    "pylint>=4.0.8",
    "pyrefly>=1.3.0",
    "pytest>=9.1.1",
    "pytest-benchmark>=5.3.0",
    "pytest-memray>=1.10.0",
    "pytest-randomly>=5.0.0",
    "pytest-run-parallel>=0.10.0",
    "pytest-socket>=0.8.1",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "radon>=6.0.1",
    "refurb>=2.3.1",
    "ruff>=0.16.7",
    "schemathesis>=4.27.1",
    "time-machine>=3.5.1",
    "twine>=7.0.0",
    "ty>=0.0.80",
    "typeguard>=4.6.0",
    "uvicorn>=0.52.4",
    "validate-pyproject[all]>=0.26",
    "vcrpy>=8.3.0",
    "vulture>=2.16",
    "xdoctest>=1.3.2",
]

# BEGIN BUGHUNT MANAGED MUTMUT CONFIG
[tool.mutmut]
source_paths = ["src/"]
pytest_add_cli_args_test_selection = ["tests/"]
# Coverage gaps are reported separately as BHCOV001/BHCOV002. Restrict mutation
# to covered lines by default so mutation testing measures assertion strength
# instead of spending most of its budget on code the suite never executes.
mutate_only_covered_lines = true
# END BUGHUNT MANAGED MUTMUT CONFIG
