id: strptime-without-zone
language: Python
severity: warning
message: |
  strptime without a %z or %Z directive builds a naive datetime; everything
  downstream then has to guess the zone. The interval work in this repo treats a
  stamp as an interval END in the site timezone, so a naive parse is where an
  off-by-one-hour starts.
note: |
  A literal Z is not a zone directive: "%Y%m%dT%H%M%SZ" (the .ics shape) still
  yields a naive value, which is why this flags it too. Prefer parsing an
  unambiguous UTC column - the published rows carry time_utc and
  interval_end_utc for exactly this reason - or attach the zone at parse time
  with %z / datetime.fromisoformat on an offset-bearing string.

  The regex reads "a format string with no %z/%Z directive": the alternation
  matches either a % followed by some other character, or a non-% character, so
  a zone directive is the one thing it cannot consume.
rule:
  pattern: datetime.strptime($TEXT, $FORMAT)
constraints:
  FORMAT:
    kind: string
    regex: '^"(?:%[^zZ]|[^%])*"$'
