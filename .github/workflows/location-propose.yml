name: location-propose

# Issue -> branch (+PR when allowed): a `[Location]:` issue stages a one-entry
# registry branch automatically. Secret-free by design: parses the issue-form
# body, validates via scripts/issue_location_to_pr.py (same config.load_sites
# rules as intake). That branch is what location-intake validates and the owner
# merges; location-calibrate only ever runs post-merge on main. This repo
# blocks Actions-created PRs, so the workflow stages the branch and comments
# the handoff by default, and opens the PR itself when allow-PR is enabled.
#
# Every outcome comments back on the issue and labels it:
#   ready     -> branch staged (`ready` label; `Closes #N` PR when allow-PR is on)
"on":
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number to propose (maintainer re-run)"
        required: false
        type: number
      allow_pr:
        description: "Actually open the PR (repo blocks Actions-created PRs by default)"
        required: false
        default: false
        type: boolean
  issues:
    types: [opened, edited]
permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  propose:
    if: startsWith(github.event.issue.title, '[Location]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.15"
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --locked

      - name: Parse issue into a registry append
        id: parse
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          printf '%s' "$ISSUE_BODY" > /tmp/issue-body.md
          set +e
          uv run python scripts/issue_location_to_pr.py /tmp/issue-body.md locations.yaml /tmp/proposed-locations.yaml > /tmp/parse-out.txt 2>&1
          code=$?
          cat /tmp/parse-out.txt
          if [ "$code" -ne 0 ]; then
            if grep -q "^Error: duplicate:" /tmp/parse-out.txt; then echo "reason=duplicate" >> "$GITHUB_OUTPUT"; else echo "reason=invalid" >> "$GITHUB_OUTPUT"; fi
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          uv run python scripts/validate_locations.py --base locations.yaml --proposed /tmp/proposed-locations.yaml > /tmp/intake.md 2>&1
          code=$?
          cat /tmp/intake.md
          if [ "$code" -ne 0 ]; then
            cp /tmp/intake.md /tmp/parse-out.txt
            echo "reason=invalid" >> "$GITHUB_OUTPUT"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cat /tmp/intake.md >> "$GITHUB_STEP_SUMMARY"
          echo "reason=ready" >> "$GITHUB_OUTPUT"
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Comment outcome on the issue
        if: steps.parse.outputs.ok != 'true'
        uses: actions/github-script@v8.0.0
        with:
          script: |
            const fs = require('fs');
            const reason = '${{ steps.parse.outputs.reason }}';
            let detail = 'Could not parse this issue into a location proposal.';
            try { detail = fs.readFileSync('/tmp/parse-out.txt', 'utf8').trim() || detail; } catch (e) {}
            const label = reason === 'duplicate' ? 'duplicate' : 'invalid';
            const heading = reason === 'duplicate'
              ? '### Location proposal: duplicate\n\nThis slug is already registered — no PR opened.'
              : '### Location proposal: needs attention\n\nThe proposal is broken — no PR opened.';
            await github.rest.issues.addLabels({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, labels: [label],
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `${heading}\n\n\`\`\`\n${detail}\n\`\`\`\n\nEdit the issue fields (name, slug, latitude, longitude, timezone) and re-run by editing the issue — or ask a maintainer.`,
            });

      - name: Open registry PR
        if: steps.parse.outputs.ok == 'true'
        uses: actions/github-script@v8.0.0
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('/tmp/intake.md', 'utf8');
            const issueNo = context.payload.issue.number;
            const branch = `location-issue-${issueNo}`;
            const proposed = fs.readFileSync('/tmp/proposed-locations.yaml', 'utf8');
            const { data: { default_branch } } = await github.rest.repos.get(context.repo);
            let sha;
            try {
              const ref = await github.rest.git.getRef({ ...context.repo, ref: `heads/${branch}` });
              sha = ref.data.object.sha;
            } catch (e) { sha = null; }
            const { data: base } = await github.rest.repos.getContent({ ...context.repo, path: 'locations.yaml', ref: default_branch });
            const baseSha = base.sha;
            const headSha = sha || (await github.rest.git.getRef({ ...context.repo, ref: `heads/${default_branch}` })).data.object.sha;
            if (!sha) {
              await github.rest.git.createRef({ ...context.repo, ref: `refs/heads/${branch}`, sha: headSha });
            }
            await github.rest.repos.createOrUpdateFileContents({
              ...context.repo, path: 'locations.yaml', branch,
              message: `Propose location from #${issueNo}`,
              content: Buffer.from(proposed).toString('base64'),
              sha: (await github.rest.repos.getContent({ ...context.repo, path: 'locations.yaml', ref: branch }).catch(() => ({ data: {} }))).data.sha || baseSha,
            });
            const openPrs = await github.rest.pulls.list({ ...context.repo, head: `${context.repo.owner}:${branch}`, base: default_branch, state: 'open' });
            let pr = openPrs.data[0] || null;
            const allowPr = (process.env.ALLOW_PR || '').toLowerCase() === 'true';
            if (!pr && allowPr) {
              pr = (await github.rest.pulls.create({
                ...context.repo, head: branch, base: default_branch,
                title: `Propose location from #${issueNo}`,
                body: `Closes #${issueNo}.\n\n${plan}\n\nReview: \`location-intake\` validates this PR; merge to calibrate.`,
              })).data;
            }
            for (const l of ['duplicate', 'invalid']) {
              try {
                await github.rest.issues.removeLabel({ ...context.repo, issue_number: issueNo, name: l });
              } catch (e) {}
            }
            await github.rest.issues.addLabels({
              ...context.repo, issue_number: issueNo, labels: ['ready'],
            });
            await github.rest.issues.createComment({
              ...context.repo, issue_number: issueNo,
              body: pr
                ? `### Location proposal: ready\n\n${plan}\n\nOpened #${pr.number} — review and merge to calibrate.`
                : `### Location proposal: ready\n\n${plan}\n\nBranch \`${branch}\` is staged with the one-entry append (Actions is blocked from opening PRs in this repo's settings: \`Settings → Actions → General → Allow GitHub Actions to create and approve pull requests\`). A maintainer opens the PR from that branch, or flips the setting and re-runs this workflow with allow-PR on.`,
            });
