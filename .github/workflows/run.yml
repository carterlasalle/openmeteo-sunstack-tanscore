name: forecast-run

# 12:23am / 9:23am / 12:23pm / 9:23pm America/Indiana, DST handled by
# GitHub. Minute 23 dodges the start-of-hour load spike that was delaying
# our on-the-hour slots by hours and dropping some (documented behavior).
"on":
  schedule:
    - cron: "23 0,9,12,21 * * *"
      timezone: "America/Indiana/Indianapolis"
  workflow_dispatch:
  push:
    # NOT "docs/**": site-refresh commits the regenerated site back to main, so
    # matching it here makes every forecast-run trigger the next one. The run
    # itself publishes docs/, and the schedule plus code pushes still gate it.
    paths:
      - "scripts/verify_rendered_ui.py"
      - "src/sunstack/**"
      - "data/research/**"
      - "scripts/build_spectral_corpus.py"
      - "scripts/train_spectral_emulator.py"
      - "scripts/rebuild_v4_references.py"
      - "scripts/validate_published_artifact.py"
      - "scripts/check_literature.py"
      - "scripts/verify_uvi.py"
      - "docs/SCIENCE.md"
  pull_request:
    paths:
      - "docs/**"
      - "scripts/verify_rendered_ui.py"
      - "src/sunstack/**"
      - "data/research/**"
      - "scripts/build_spectral_corpus.py"
      - "scripts/train_spectral_emulator.py"
      - "scripts/rebuild_v4_references.py"
      - "scripts/validate_published_artifact.py"
      - "scripts/check_literature.py"
      - "scripts/verify_uvi.py"
      - "docs/SCIENCE.md"

permissions:
  contents: write

concurrency:
  group: forecast-run
  cancel-in-progress: false

jobs:
  science-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.15"
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --locked
      # Contract §25.1: science correctness on pushes/PRs touching science
      # code, research data, calibration/reference scripts, SCIENCE.md, or
      # validation scripts. Scheduled publish needs no gate: Gate 3 inside
      # the run aborts publication itself.
      - name: Lint
        run: uv run ruff check src tests scripts
      - name: Tests
        run: uv run pytest tests/ -q
      - name: Type check
        # basedpyright exits 1 whenever warnings exist (3000 pandas-stub
        # warnings on this stack), even with `--level error` and 0 errors.
        # Gate on the machine-readable error count instead: any real error
        # fails the step; warnings never block the science gate.
        run: |
          uv run --with basedpyright==1.40.1 basedpyright --level error --outputjson > /tmp/bp.json || true
          python3 -c "import json,sys; d=json.load(open('/tmp/bp.json')); e=d.get('summary',{}).get('errorCount',-1); print(f'basedpyright errors={e}'); sys.exit(1 if e else 0)"
      - name: Literature-informed regression invariants
        run: uv run python scripts/check_literature.py
      - name: Validate committed published artifacts
        run: |
          uv run python scripts/validate_published_artifact.py docs/data.json
          for site in docs/sites/*/data.json; do
            [ -f "$site" ] && uv run python scripts/validate_published_artifact.py "$site"
          done
  rendered-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.15"
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --locked
      - name: Install Chromium
        run: uv run --with playwright python -m playwright install --with-deps chromium
      # Real Chromium over the committed export: the physics module and the page
      # must agree on the plane factor, material/tilt must reach the hero, the
      # rendered ranking row must match the payload field it came from, there
      # must be no console errors and no page-wide horizontal overflow, at both
      # 1350px and 390px.
      # The live artifact: every check runs against the payload that ships.
      - name: Rendered UI contract (1350px + 390px, published artifact)
        run: uv run --with playwright --with pillow python scripts/verify_rendered_ui.py
      # The visual gate renders the FROZEN fixture. A pixel baseline against the
      # live payload would fail on every scheduled run, because the dates and
      # doses change - that is data, not a regression.
      - name: Rendered UI visual gate (frozen fixture)
        run: |
          uv run --with playwright --with pillow python scripts/verify_rendered_ui.py \
            --site-dir tests/fixtures/rendered_site \
            --out /tmp/fixture_report.md \
            --shots-dir /tmp/fixture_shots \
            --baseline docs/validation/rendered_ui_baseline
      # Seed the baseline once, on main. The visual gate needs a baseline made by
      # the runner's own renderer: fonts and antialiasing differ between macOS
      # and Linux, so a locally made baseline would fail here for no reason.
      - name: Seed the visual baseline (main only, first run)
        if: github.event_name != 'pull_request'
        run: |
          if ls docs/validation/rendered_ui_baseline/*.png >/dev/null 2>&1 \
             && [ "$(cat docs/validation/rendered_ui_baseline/fixture.sha256 2>/dev/null)" \
                  = "$(cat /tmp/fixture_shots/fixture.sha256 2>/dev/null)" ]; then
            echo "baseline present; the visual gate above compared against it"
            exit 0
          fi
          mkdir -p docs/validation/rendered_ui_baseline
          cp /tmp/fixture_shots/*.png /tmp/fixture_shots/fixture.sha256 \
             docs/validation/rendered_ui_baseline/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/validation/rendered_ui_baseline
          git diff --quiet --cached && echo "nothing to seed" || {
              git commit -m "Seed the rendered-UI visual baseline $(date -u +%Y%m%d_%H%M)"
            # site-refresh may have pushed a generated commit in the meantime;
            # the seed is an optimisation, so a lost race must not fail the gate.
            git pull --rebase --autostash || true
            git push || echo "notice: baseline seed skipped (branch moved); gate stays unseeded"
          }
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-ui-screenshots-${{ github.run_id }}
          path: docs/validation/rendered_ui/
          retention-days: 30
      # The deployed page must serve the run-stamped payload. Pages lags a push
      # by about a minute, so retry instead of reporting a false failure.
      - name: Published URL smoke test
        run: |
          url="https://carterlasalle.github.io/openmeteo-sunstack-tanscore/"
          for attempt in 1 2 3 4 5; do
            code=$(curl -s -o /tmp/published.html -w '%{http_code}' "$url")
            if [ "$code" = "200" ] && grep -q "data.json?v=" /tmp/published.html; then
              echo "published page served the run-stamped payload (HTTP $code)"
              exit 0
            fi
            echo "attempt $attempt: HTTP $code; waiting for Pages"
            sleep 20
          done
          echo "published page did not serve the run-stamped payload"
          exit 1

  run:
    # The publish job commits the regenerated artifact; it must never run on a
    # pull request (no write token there, and it only publishes the artifact it
    # just produced from live data).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Publishes every site in sequence, each with a full live pipeline (feeds,
    # NASA POWER history, CAMS, calibration). Measured on 2026-10-12: the step
    # was still running at the 60-minute mark and the job was cancelled, so the
    # artifact never landed. 180 leaves room for two sites plus a slow feed day.
    # The upgrade path, if this wall gets tight, is to share one history fetch
    # across sites instead of repeating it per site - not to publish less often.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          # required-version in pyproject.toml pins the exact uv; without a
          # version input setup-uv falls back to latest and regenerates the
          # lockfile mid-run, which later breaks `git pull --rebase`.
          version: "0.12.15"
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --locked

      - name: Forecast + export + publish, one site at a time
        run: uv run sunstack run
        env:
          CDSAPI_URL: ${{ secrets.CDSAPI_URL }}
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}

      - name: Bundle run data for download
        if: always()
        run: |
          mkdir -p /tmp/sunstack-bundle
          cp -r data/latest /tmp/sunstack-bundle/latest 2>/dev/null || true
          for d in data/sites/*/latest; do
            slug=$(echo "$d" | cut -d/ -f3)
            mkdir -p "/tmp/sunstack-bundle/sites/$slug"
            cp -r "$d" "/tmp/sunstack-bundle/sites/$slug/latest" 2>/dev/null || true
          done

      - name: Upload run data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sunstack-data-${{ github.run_id }}
          path: /tmp/sunstack-bundle/
          retention-days: 90
