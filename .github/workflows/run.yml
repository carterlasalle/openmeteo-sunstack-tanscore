name: forecast-run

# 12:23am / 9:23am / 12:23pm / 9:23pm America/Indiana, DST handled by
# GitHub. Minute 23 dodges the start-of-hour load spike that was delaying
# our on-the-hour slots by hours and dropping some (documented behavior).
"on":
  schedule:
    - cron: "23 0,9,12,21 * * *"
      timezone: "America/Indiana/Indianapolis"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forecast-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --frozen

      - name: Forecast run
        run: uv run sunstack run
        env:
          CDSAPI_URL: ${{ secrets.CDSAPI_URL }}
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}

      - name: Export static site
        run: uv run sunstack export --site-dir docs

      - name: Publish results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs && git add -f data/calibration
          git diff --quiet --cached && echo "no changes" || git commit -m "Scheduled run $(date -u +%Y%m%d_%H%M)"
          # Local pushes may land mid-run; rebase so the fresh export wins.
          git pull --rebase -X ours || (git rebase --abort && exit 1)
          git push
